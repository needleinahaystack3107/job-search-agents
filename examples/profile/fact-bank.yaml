# FICTIONAL EXAMPLE. Copy this folder to profile/ and replace everything with your own facts.
# The fact bank is the only source a resume or cover letter may draw from. Every bullet the Writer
# produces must trace to an entry here; the Verifier's fact-check rejects anything that does not.
#
# status: resume  = already on a resume you have used
#         stated  = you said it in an intake conversation
#         repo    = shown in a public repository
# open:   things a resume bullet would need that you have not said yet. Not usable until answered.

